[package]
name = "ccword"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "macOS companion that shows one local word completion inside Claude Code"
license = "MIT"
publish = false

[[bin]]
name = "ccword"
path = "src/main.rs"

[[bin]]
name = "ccword-fake-tui"
path = "src/bin/ccword-fake-tui.rs"

[dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
libc = "0.2"
portable-pty = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
unicode-normalization = "0.1"
unicode-segmentation = "1"
unicode-width = "0.2"
vt100 = "0.16"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSRunningApplication", "NSSpellChecker"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
redundant_clone = "warn"
needless_collect = "warn"
